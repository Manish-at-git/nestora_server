# This file declares only the new server's direct runtime and development dependencies.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nestora-server"
version = "0.1.0"
description = "Clean, session-based FastAPI backend for Nestora"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.53,<0.54",
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "aiomysql==0.3.2",
  "PyMySQL>=1.2,<1.3",
  "alembic>=1.20,<1.21",
  "pydantic-settings>=2.12,<3",
  "bcrypt>=5,<6",
  "cryptography>=44,<46",
  "email-validator>=2.3,<3",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4",
  "cloudinary>=1.44,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.19,<2",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a separately migrated MySQL test database",
]

[tool.setuptools.packages.find]
# Make `python -m pip install -e .` install the app and command-script packages.
include = ["app*", "scripts*"]
